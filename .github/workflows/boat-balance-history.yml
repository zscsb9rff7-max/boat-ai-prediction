name: BOAT BALANCE official history
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/boat-balance-history.yml']
permissions:
  contents: write
concurrency:
  group: boat-balance-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boat-balance-history
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect recent results and a historical batch
        run: node collector/collect.cjs
        env:
          HISTORY_START: '1996-01-01'
          BATCH_DAYS: '200'
      - name: Save archive and progress
        if: always()
        run: |
          git config user.name 'BOAT BALANCE collector'
          git config user.email 'boat-balance-collector@users.noreply.github.com'
          git add history
          if ! git diff --cached --quiet; then
            git commit -m 'Update official race history and collection progress'
            git push origin HEAD:boat-balance-history
          fi
