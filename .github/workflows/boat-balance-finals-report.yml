name: BOAT BALANCE finals report
on:
  push:
    branches: [main]
    paths: ['boat-balance-finals-report.py', '.github/workflows/boat-balance-finals-report.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-balance-finals-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: boat-balance-history
          path: archive
      - run: python3 boat-balance-finals-report.py
      - name: Save report snapshot
        working-directory: archive
        run: |
          git config user.name 'BOAT BALANCE collector'
          git config user.email 'boat-balance-collector@users.noreply.github.com'
          git add history/reports/finals-24-all-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggregate all saved official final races for PDF report'
            git pull --rebase origin boat-balance-history
            git push origin HEAD:boat-balance-history
          fi
