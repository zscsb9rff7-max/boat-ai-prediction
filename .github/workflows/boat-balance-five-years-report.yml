name: BOAT BALANCE five year report
on:
  push:
    branches: [main]
    paths: ['boat-balance-five-years-report.py', '.github/workflows/boat-balance-five-years-report.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: boat-balance-history
          path: archive
      - run: python3 boat-balance-five-years-report.py
      - working-directory: archive
        run: |
          git config user.name 'BOAT BALANCE collector'
          git config user.email 'boat-balance-collector@users.noreply.github.com'
          git add history/reports/finals-24-five-years.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save five year finals venue report'
            git pull --rebase origin boat-balance-history
            git push origin HEAD:boat-balance-history
          fi
